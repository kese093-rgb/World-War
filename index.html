const relations={};

for(let c in countryData){
    if(c!==player){
        relations[c]="neutral";
    }
}

let alliances=[];
let wars=[];

const colors={
    player:"#2563eb",
    neutral:"#64748b",
    ally:"#16a34a",
    enemy:"#dc2626",
    occupied:"#9333ea"
};

function countryColor(name){

    if(name===player) return colors.player;

    if(alliances.includes(name))
        return colors.ally;

    if(wars.includes(name))
        return colors.enemy;

    return colors.neutral;
}

function log(text){

    const box=document.getElementById("log");

    const div=document.createElement("div");
    div.className="logline";
    div.textContent=text;

    box.prepend(div);

    while(box.children.length>15)
        box.removeChild(box.lastChild);
}

function updateTop(){

    document.getElementById("turn").textContent=turn;

    document.getElementById("money").textContent=
        countryData[player].money;

    document.getElementById("army").textContent=
        countryData[player].power;

    document.getElementById("tech").textContent=
        countryData[player].tech;

    let score=countryData[player].power+
        countryData[player].money/5+
        countryData[player].population;

    document.getElementById("rank").textContent=
        Math.floor(score);
}

function showPanel(name){

    const c=countryData[name];

    if(!c) return;

    const panel=document.getElementById("panel");

    panel.style.display="block";

    let status=relations[name]||"neutral";

    let html=`
        <h2>${name}</h2>

        <div class="info">
        ⚔ Армия: <b>${c.power}</b><br>
        💰 Экономика: <b>${c.money}</b><br>
        👥 Население: <b>${c.population} млн</b><br>
        🔬 Технологии: <b>${c.tech}</b><br>
        🛡 Стабильность: <b>${c.stability}%</b><br>
        🤝 Отношения: <b>${status}</b>
        </div>
    `;

    if(name!==player){

        if(status!=="allied"){
            html+=`
            <button class="green"
            onclick="makeAlliance('${name}')">
            🤝 Предложить союз
            </button>
            `;
        }

        if(!wars.includes(name)){
            html+=`
            <button class="red"
            onclick="declareWar('${name}')">
            ⚔ Начать войну
            </button>
            `;
        }else{

            html+=`
            <h3>⚔ Военные действия</h3>
            `;

            c.cities.forEach((city,i)=>{

                html+=`
                <button class="gold"
                onclick="attackCity('${name}',${i})">
                🏙 Атаковать ${city[0]}
                </button>
                `;

            });

            html+=`
            <button class="blue"
            onclick="peace('${name}')">
            🕊 Предложить мир
            </button>
            `;
        }
    }

    html+=`
        <h3>Города</h3>
        <div class="info">
        ${c.cities.map(x=>x[0]).join(", ")}
        </div>
    `;

    panel.innerHTML=html;
}

function makeAlliance(name){

    if(alliances.includes(name)){
        log("Союз уже существует.");
        return;
    }

    alliances.push(name);
    relations[name]="allied";

    countryData[name].stability+=5;

    log(`🤝 Россия заключила союз с ${name}`);

    showPanel(name);
    draw();
}

function declareWar(name){

    if(allies(name)) return;

    if(!wars.includes(name))
        wars.push(name);

    relations[name]="war";

    countryData[player].stability-=5;

    log(`⚔ Россия объявила войну: ${name}`);

    showPanel(name);
    draw();
}

function allies(name){

    return alliances.includes(name);
}

function attackCity(name,index){

    if(!wars.includes(name)){
        log("Сначала начни войну.");
        return;
    }

    const enemy=countryData[name];

    const city=enemy.cities[index];

    let amount=prompt(
        `Сколько мощности армии потратить на атаку ${city[0]}?\nТвоя армия: ${countryData[player].power}`
    );

    if(amount===null) return;

    amount=parseInt(amount);

    if(isNaN(amount)||amount<=0){
        alert("Неверное число.");
        return;
    }

    if(amount>countryData[player].power){
        alert("У тебя недостаточно армии.");
        return;
    }

    let defense=
        Math.floor(enemy.power/enemy.cities.length);

    let attackPower=
        amount*(1+countryData[player].tech*0.15);

    let chance=
        attackPower/(attackPower+defense);

    let roll=Math.random();

    countryData[player].power-=amount;

    if(roll<chance){

        enemy.power=
            Math.max(0,enemy.power-Math.floor(amount*0.35));

        city.push("occupied");

        log(
            `🏙 Россия захватила ${city[0]} у ${name}!`
        );

        enemy.stability-=10;

        if(enemy.stability<0)
            enemy.stability=0;

    }else{

        let losses=Math.floor(amount*0.5);

        enemy.power=
            Math.max(0,enemy.power-Math.floor(amount*0.2));

        log(
            `❌ Атака на ${city[0]} провалилась. Потери: ${losses}`
        );
    }

    updateTop();
    showPanel(name);
    draw();
}

function peace(name){

    const i=wars.indexOf(name);

    if(i!==-1)
        wars.splice(i,1);

    relations[name]="neutral";

    log(`🕊 Россия заключила мир с ${name}`);

    showPanel(name);
    draw();
}

function endTurn(){

    turn++;

    const p=countryData[player];

    p.money+=Math.floor(30+p.population*2);

    p.power+=Math.floor(10+p.tech*3);

    if(p.power>1000)
        p.power=1000;

    /*
       ИИ
    */

    for(let name in countryData){

        if(name===player) continue;

        const c=countryData[name];

        c.money+=20+c.population;

        c.power+=5+c.tech*2;

        if(c.power>700)
            c.power=700;

        if(Math.random()<0.04){

            c.tech++;

            log(`🔬 ${name} развил технологии.`);
        }
    }

    updateTop();

    log(`📅 Начался ход ${turn}`);

    draw();
}

function research(){

    const p=countryData[player];

    const price=300*p.tech;

    if(p.money<price){

        alert("Недостаточно денег.");

        return;
    }

    p.money-=price;
    p.tech++;

    log(
        `🔬 Технологии России повышены до ${p.tech}`
    );

    updateTop();
}

function recruit(){

    const p=countryData[player];

    const price=100;

    if(p.money<price){

        alert("Недостаточно денег.");

        return;
    }

    p.money-=price;
    p.power+=50;

    log("🪖 Россия мобилизовала 50 мощности армии.");

    updateTop();
}

/*
=========================================
ЗАГРУЗКА РЕАЛЬНЫХ ГРАНИЦ СТРАН
=========================================
*/

d3.json(
"https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json"
).then(world=>{

    const countries=
        topojson.feature(
            world,
            world.objects.countries
        );

    drawMap(countries);

}).catch(error=>{

    console.error(error);

    log(
        "Ошибка загрузки географических данных."
    );

});

/*
=========================================
КАРТА
=========================================
*/

let mapLayer;
let cityLayer;

function drawMap(countries){

    mapLayer=svg.append("g");

    mapLayer.selectAll("path")
        .data(countries.features)
        .enter()
        .append("path")
        .attr("class","country")
        .attr("d",path)
        .attr("fill",function(d){

            const name=idToCountry[d.id];

            return countryColor(name);

        })
        .on("click",function(event,d){

            const name=idToCountry[d.id];

            if(name && countryData[name])
                showPanel(name);

        });

    cityLayer=svg.append("g");

    drawCities();

    updateTop();
}

function drawCities(){

    if(!cityLayer) return;

    cityLayer.selectAll("*").remove();

    for(let country in countryData){

        const c=countryData[country];

        c.cities.forEach(city=>{

            const p=
                projection([city[1],city[2]]);

            if(!p) return;

            cityLayer
                .append("circle")
                .attr("class","city")
                .attr("cx",p[0])
                .attr("cy",p[1])
                .attr("r",city[3]==="occupied"?6:4)
                .attr("fill",
                    city[3]==="occupied"
                    ?"purple"
                    :"white")
                .on("click",()=>{

                    showPanel(country);

                    log(
                        `🏙 ${city[0]} — ${country}`
                    );

                });
        });
    }
}

function draw(){

    if(!mapLayer) return;

    mapLayer
        .selectAll("path")
        .attr("fill",function(d){

            const name=idToCountry[d.id];

            return countryColor(name);

        });

    drawCities();
}
